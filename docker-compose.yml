version: '3.8'

services:
  qa-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-dataops-pipeline
    volumes:
      - ./sample_data:/app/sample_data:ro
      - ./output:/app/output
    environment:
      - PYTHONUNBUFFERED=1
    # Current CLI: python main.py <input.xlsx> [--output-dir DIR]
    command: ["sample_data/sample_input.xlsx", "--output-dir", "/app/output"]

  # Prometheus for metrics collection (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: qa-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    profiles:
      - monitoring

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: qa-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./monitoring/grafana:/var/lib/grafana
    depends_on:
      - prometheus
    profiles:
      - monitoring
