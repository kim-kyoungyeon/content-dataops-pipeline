name: graph-validate

on:
  push:
    branches: [main, develop]
    paths: ["grammar_graph/**", ".github/workflows/graph-validate.yml"]
  pull_request:
    branches: [main]
    paths: ["grammar_graph/**", ".github/workflows/graph-validate.yml"]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: grammar_graph
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: grammar_graph/requirements.txt
      - run: pip install -r requirements.txt
      - name: Structural validation (schema, cycle, reachability, item tags, roadmap freshness)
        run: python tools/validate.py --check
      - name: Tests
        run: pytest -q
